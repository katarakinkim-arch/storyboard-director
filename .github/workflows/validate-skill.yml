name: Validate skill package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run release-manager tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check version and packaged skill synchronization
        run: python scripts/manage_release.py check
